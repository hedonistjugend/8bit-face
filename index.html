const palFamOf = id => id === -3 ? 'orange' : id === -4 ? 'indigo' : FAMILY;
function colorsOf(fam){
  const [c100, c400, c600, c950] = TW[fam];

}
function applyColors(bg, fg){
  FG = fg;

  st.setProperty('--fg', fg);
  st.setProperty('--txt', fg);

}
function hexRgb(h){
  h = (h || '#000').replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) || 0);
}
function rgbHex(r, g, b){
  return '#' + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
}
function mixHex(a, b, t){
  const A = hexRgb(a), B = hexRgb(b);
  let r = A[0] + (B[0] - A[0]) * t, g = A[1] + (B[1] - A[1]) * t, bl = A[2] + (B[2] - A[2]) * t;
  // в середине RGB-смесь синего и оранжевого сереет — чуть поднимаем насыщенность
  const mid = 1 - Math.abs(2 * t - 1), avg = (r + g + bl) / 3, s = 1 + 0.9 * mid;
  return rgbHex(avg + (r - avg) * s, avg + (g - avg) * s, avg + (bl - avg) * s);
}
let palT = 1, palA = null, palB = null, palTarget = FAMILY;
function applyTheme(){
  const t = q.get('theme');
  LIGHT = t ? t === 'light' : mq.matches;
  palTarget = (EQ0 === 'btc' || EQ0 === 'bitcoin') ? 'orange'
            : (EQ0 === 'eth' || EQ0 === 'ethereum' || EQ0 === 'ether') ? 'indigo'
            : palTarget || FAMILY;
  const [bg, fg] = colorsOf(palTarget);
  applyColors(bg, fg);
  palA = palB = [bg, fg]; palT = 1;
}
function goPal(fam){
  palTarget = fam;
  const nowBg = document.documentElement.style.getPropertyValue('--bg') || colorsOf(FAMILY)[0];
  palA = [nowBg, FG];
  palB = colorsOf(fam);
  palT = (palA[0].toLowerCase() === palB[0].toLowerCase() && palA[1].toLowerCase() === palB[1].toLowerCase()) ? 1 : 0;
}
function updatePal(){
  if (palT >= 1) return;
  palT = Math.min(1, palT + 1 / 40);
  const u = palT < 0.5 ? 4 * palT * palT * palT : 1 - Math.pow(-2 * palT + 2, 3) / 2;
  applyColors(mixHex(palA[0], palB[0], u), mixHex(palA[1], palB[1], u));
}
mq.addEventListener && mq.addEventListener('change', applyTheme);
applyTheme();
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let cell, cx, cy;

   cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';

// Лицо из прямоугольников в клетках (границы клеток). depth — насколько деталь "выступает" (нос сильнее)
const parts = [

const smallParts = [

  { x0: 0, x1: 1, y0:0, y1:5, depth:2 },

// Выражения в стиле исходного лица: минимум крупных клеток. Глаз — рисунок вокруг центра глаза
// (x -5 и 4, как у обычного лица), нижняя строка рисунка стоит на y=1 (или y0 задаёт верх).
// r — рисунок правого глаза, если он отличается от левого
const X3 = ['#.#','.#.','#.#'], STAR = ['.#.','###','.#.'], HAT = ['.#.','#.#'], RING = ['.#.','#.#','.#.'];
const EXPR = [
  {n:'smile',        l:['.##.','#..#'], m:'smile'},

  {n:'sleepy tired', l:['###'], m:'flat'},
  {n:'tears',        l:['#','#','.','#'], y0:0, m:'frown'},
  {n:'dizzy',        l:['.###','#..#','#.##'], m:'wavyDizzy'},
  {n:'amazed',       l:RING, m:'O', b:1},
  {n:'astonished',   l:STAR, m:'tiny'},
  {n:'ouch',         l:['#.','.#','#.'], r:['.#','#.','.#'], m:'wavy'},
  {n:'happy',        l:HAT, m:'smile'},
  {n:'happier',      l:['#...','..#.','.#.#'], r:['...#','.#..','#.#.'], m:'grin'},
  {n:'glad',         l:HAT, m:'smallSmile'},
  {n:'dead',         l:X3, m:'dot'},
  {n:'bored',        l:['##','..','##'], m:'flat'},
  {n:'i love it',    l:STAR, m:'grin'},
  {n:'sad',          l:['#','#','.','#'], y0:-2, m:'frown', b:1},
  {n:'incredulous',  l:['#'], r:RING, m:'crooked', b:1},
  {n:'incredible',   l:STAR, m:'O'},
  {n:'seriously',    l:['##','##'], m:'flat', b:1},
  {n:'crying bad',   l:['#','#','.','#'], y0:0, m:'o'},
  {n:'confused',     l:['#'], r:['#','.','.'], m:'crookedL', b:1},
  {n:'i messed it up', l:['###'], r:['...#','...#','###.'], m:'smallFrown'},
  {n:'serious',      l:['#','#'], y0:-1, m:'flat', b:1},
  {n:'sleepy sad',   l:['#.#','.#.'], m:'smallFrown'},
  {n:'noooo',        l:X3, m:'O'},
  {n:'yuck',         l:['#.','.#','#.'], r:['.#','#.','.#'], m:'o'},
  {n:'wink',         l:['###'], r:RING, m:'smirk'},
  {n:'jealous',      l:['#.#.','...#','#.#.'], r:['.#.#','#...','.#.#'], m:'wavy'},
  {n:'didnt sleep',  l:['##','##','.#'], m:'flat', b:1},
  {n:'awry',         l:['#.','.#','#.'], m:'crooked'},
  {n:'youre crazy',  l:['.#.#','#.#.'], m:'o'},
];
// Рты: [рисунок, x, y] для маленького лица (не больше 6 клеток)
const MOUTH = {
  smile:     [['#....#','.####.'], -3, 7],
  frown:     [['.####.','#....#'], -3, 7],
  smallSmile:[['#..#','.##.'], -2, 7],
  smallFrown:[['.##.','#..#'], -2, 7],
  flat:      [['####'], -2, 8],
  O:         [['.#.','#.#','.#.'], -1, 7],
  o:         [['##','##'], -1, 7],
  tiny:      [['.##.','#..#'], -2, 8],
  dot:       [['##'], -1, 8],
  crooked:   [['..##','##..'], -2, 7],
  crookedL:  [['##..','..##'], -2, 7],
  wavy:      [['#.#.#','.#.#.'], -2, 7],
  wavyDizzy: [['.#..#.','#.##.#'], -3, 7],
  grin:      [['####','.##.'], -2, 7],
  smirk:     [['...#','###.'], -2, 7],

const artCells = ([rows, ox, oy]) => rows.flatMap((r, j) => [...r].flatMap((ch, i) => ch === '#' ? [[ox + i, oy + j]] : []));
const eyeCells = (art, ex, y0) => artCells([art, ex - Math.floor((art[0].length - 1) / 2), y0 ?? 2 - art.length]);

for (const e of EXPR){
  const bx = SMALL ? 0 : 1, by = SMALL ? 0 : 1;
  e.eyes = [eyeCells(e.l, -5 - bx, e.y0), eyeCells(e.r || e.l, 4 + bx, e.ry0 ?? e.y0)];
  e.mouth = artCells(MOUTH[e.m]).map(([x, y]) => [x, y + by]);
}
// Состояния лица в клетках: глаза (список глифов), рот, b — моргает ли, s — насколько поворачивается голова
const toCells = p => { const r = []; for (let x = p.x0; x < p.x1; x++) for (let y = p.y0; y < p.y1; y++) r.push([x, y]); return r; };
const ringCells = p => toCells(p).filter(([x, y]) => {
  const ex = x === p.x0 || x === p.x1 - 1, ey = y === p.y0 || y === p.y1 - 1;
  return (ex || ey) && !(ex && ey);
});
const partsState = (ps, b) => ({ eyes: ps.filter(p => p.eye).map(toCells),
  mouth: ps.filter(p => !p.eye && !p.depth).flatMap(p => p.ring ? ringCells(p) : toCells(p)), b, s: 1 });
for (const e of EXPR) e.s = 1;
// Пока в случайной смене только первый ряд выражений (остальные доступны через ?expr=N)
const CYCLE = [0, 1, 2, 3, 4, 5];
// ?expr=5 или ?expr=dizzy фиксирует выражение, ?cycle=fast — быстрая смена
// ?expr=btc|eth — застывший график; ?crypto=1 цикл крипто-сцен, ?crypto=0 выключить
let expr = -1, exprTimer = 0, exprFixed = false;
const FAST = q.get('cycle') === 'fast';
const findExpr = v => {
  v = (v || '').toLowerCase().replace(/[_+-]/g, ' ');
  if (v === 'btc' || v === 'bitcoin') return -3;
  if (v === 'eth' || v === 'ethereum' || v === 'ether') return -4;
  if (v === 'neutral' || v === '0') return -1;
  return /^\d+$/.test(v) ? +v - 1 : EXPR.findIndex(e => e.n === v);
};
if (q.has('expr')){
  const i = findExpr(q.get('expr'));
  if (i === -3 || i === -4 || i === -1 || EXPR[i]){ expr = i; exprFixed = true; }
}
const nextExprDelay = () => FAST ? 60 + Math.random() * 90 : 180 + Math.random() * 420; // 3–10 c при 60 кадрах/с
exprTimer = nextExprDelay();

// ---- Крипто-графики: логотип как оба глаза, линия как рот, клетки перетекают из лица ----
// Ручная форма на случай, если CoinGecko не ответит. ?trend=up|down — только направление линии
const FB = {
  btc: [40, 50, 45, 70, 85, 100, 80, 55, 50, 60, 45, 35, 20],
  eth: [80, 90, 100, 85, 70, 75, 60, 55, 40, 50, 35, 30, 15]
};
const TREND = (q.get('trend') || '').toLowerCase();
function resample(vals, n){
  const out = [];
  for (let i = 0; i < n; i++){
    const a = i * (vals.length - 1) / (n - 1), i0 = Math.floor(a), i1 = Math.min(i0 + 1, vals.length - 1), t = a - i0;
    out.push(vals[i0] * (1 - t) + vals[i1] * t);
  }
  return out;
}
function lineCells(vals, x0, n, yTop, h){
  const ys = resample(vals.map(Number).filter(Number.isFinite), n);
  const mn = Math.min(...ys), mx = Math.max(...ys), r = mx - mn || 1;
  const pts = ys.map((v, i) => [x0 + i, yTop + h - Math.round((v - mn) / r * h)]);
  const seen = new Set(), cs = [];
  const add = (x, y) => { const k = x + ',' + y; if (!seen.has(k)){ seen.add(k); cs.push([x, y]); } };
  for (let i = 1; i < pts.length; i++){
    let [x, y] = pts[i - 1], [x1, y1] = pts[i];
    const dx = Math.abs(x1 - x), dy = Math.abs(y1 - y), sx = x < x1 ? 1 : -1, sy = y < y1 ? 1 : -1;
    let err = dx - dy;
    for (;;){
      add(x, y);
      if (x === x1 && y === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy){ err -= dy; x += sx; }
      if (e2 < dx){ err += dx; y += sy; }
    }
  }
  return { cs, up: ys[ys.length - 1] >= ys[0], change: (ys[ys.length - 1] - ys[0]) / (Math.abs(ys[0]) || 1) };
}
// Компактные «глаза»: B 3×5 и простой ромб ETH 3×5, без торчащих боковых точек
const GLYPH = {
  btc: ['##.','#.#','##.','#.#','##.'],
  eth: ['.#.','#.#','###','#.#','.#.']
};
function placeGlyph(art, eyeX){
  const gw = Math.max(...art.map(r => r.length)), gh = art.length;
  const ox = eyeX - Math.floor((gw - 1) / 2);
  const oy = -Math.floor((gh - 1) / 2);
  return artCells([art, ox, oy]);
}
function buildChart(kind, vals){
  const bx = SMALL ? 0 : 1, by = SMALL ? 0 : 1;
  let series = vals.slice();
  const dataUp = series[series.length - 1] >= series[0];
  let up = dataUp;
  if (TREND === 'up') up = true;
  else if (TREND === 'down') up = false;
  if (up !== dataUp) series = series.map(v => -v);
  const { cs, change } = lineCells(series, -6 - bx, 13 + 2 * bx, 6, 4 + by);
  const art = GLYPH[kind];
  const left = placeGlyph(art, -5 - bx), right = placeGlyph(art, 4 + bx);
  return { eyes: [left, right], mouth: cs, b: false, s: 1, chart: true, up, change, kind };
}
const CHARTS = { btc: buildChart('btc', FB.btc), eth: buildChart('eth', FB.eth) };
function setChart(kind, vals){
  CHARTS[kind] = buildChart(kind, vals);
  const id = kind === 'btc' ? -3 : -4;
  if (curId === id || (to && to.kind === kind)){
    const f = tf, len = tl;
    to = CHARTS[kind];
    if (curId === id && f >= len) from = to;
    else if (tracks){ startMorph(partsOf(from), partsOf(to), len); tf = f; }
  }
}

  }).catch(() => console.log('crypto fallback shapes'));
}
loadCrypto();
function nameOf(id){ return id === -1 ? 'neutral' : id === -2 ? 'surprise' : id === -3 ? 'btc' : id === -4 ? 'eth' : (id + 1) + ' ' + EXPR[id].n; }
function reactionOf(ch){
  const v = ch.change;
  return v >= 0.08 ? 5 : v >= 0 ? 0 : v <= -0.08 ? 3 : 1; // amazed / smile / tears / uh oh
}
const CRYPTO = q.get('crypto');
const cryptoOn = CRYPTO !== '0' && !exprFixed;
const cryptoLoop = CRYPTO === '1';
let seq = -1, seqWait = cryptoOn ? 120 : 1e9; // после ~2 с нейтрального лица — первая сцена
function runSeq(){
  if (!cryptoOn) return false;
  if (surprise > 0) return seq >= 0;
  if (seq < 0){
    if (--seqWait > 0) return false;
    seq = (curId === -1 && tf >= tl) ? 1 : 0;
    seqWait = 0;
  }
  if (--seqWait > 0) return true;
  const steps = [
    () => { expr = -1; goPal(FAMILY); go(-1); seqWait = 120; },
    () => { expr = -3; goPal('orange'); go(-3); seqWait = 180; },
    () => { expr = reactionOf(CHARTS.btc); go(expr); seqWait = 150; },
    () => { expr = -4; goPal('indigo'); go(-4); seqWait = 180; },
    () => { expr = reactionOf(CHARTS.eth); go(expr); seqWait = 150; },
    () => { expr = -1; goPal(FAMILY); go(-1); seqWait = 90; }
  ];
  if (seq >= steps.length){
    seq = -1;
    seqWait = cryptoLoop ? 60 : 2700 + Math.random() * 2700; // 45–90 с
    expr = -1;
    exprTimer = nextExprDelay();
    return false;
  }
  steps[seq]();
  console.log('crypto step', nameOf(expr));
  seq++;
  return true;
}
function updateExpr(){
  if (runSeq()) return;
  if (exprFixed || surprise > 0 || --exprTimer > 0) return;
  if (expr >= 0 && Math.random() < 0.4) expr = -1;               // иногда возвращаемся к обычному лицу
  else { let n; do n = CYCLE[Math.floor(Math.random() * CYCLE.length)]; while (n === expr); expr = n; }
  exprTimer = nextExprDelay();
  go(expr);
  console.log('expr', nameOf(expr));
}
let surprise = 0;
const RX = SMALL ? 7 : 8.5, RY = SMALL ? 8 : 9.5, YC = SMALL ? 4.5 : 5;
const clamp = v => Math.max(-0.999, Math.min(0.999, v));
// Проекция границы на "голову-сферу" с поворотом yaw (влево-вправо) и pitch (вверх-вниз)
const PXf = (e, k, yaw)   => RX * Math.sin(Math.asin(clamp(e / RX)) + yaw) + k * Math.sin(yaw);
const PYf = (e, k, pitch) => RY * Math.sin(Math.asin(clamp((e - YC) / RY)) + pitch) + YC + k * Math.sin(pitch);
const PX = (e, k, yaw)   => Math.round(PXf(e, k, yaw));
const PY = (e, k, pitch) => Math.round(PYf(e, k, pitch));

// Движение "размышления": голова плавно смотрит в разные точки и замирает
let yaw = 0, pitch = 0, ty = 0, tp = 0, hold = 60, blink = 0, nextBlink = 150, t = 0;
function pickTarget(){
  const poses = [[0,0],[0,0],[-0.3,-0.12],[0.3,-0.14],[-0.25,0.12],[0.22,0.15],[0,-0.2],[0.32,0],[-0.32,0.03]];
  const p = poses[Math.floor(Math.random() * poses.length)];
  ty = p[0] + (Math.random() - 0.5) * 0.06;
  tp = p[1] + (Math.random() - 0.5) * 0.06;
  hold = 50 + Math.random() * 110;
}

function step(){
  t++;
  updatePal();
  const onChart = (to && to.chart) || (from && from.chart && tf < tl);
  if (!following){
    if (onChart){ ty += (0 - ty) * 0.1; tp += (0 - tp) * 0.1; }
    else if (hold-- <= 0) pickTarget();
  }
  const speed = surprise > 0 || following ? 0.18 : 0.06;
  yaw += (ty - yaw) * speed;
  pitch += (tp - pitch) * speed;
  if (surprise > 0 && --surprise === 0) go(expr, 30);
  if (tf < tl) tf++;
  if (surprise === 0 && --nextBlink <= 0){ blink = 10; nextBlink = 120 + Math.random() * 220; }
  if (blink > 0) blink--;
  updateExpr();
  updateNose();
}
// Кончик носа загибается в сторону, противоположную повороту головы (с гистерезисом, чтобы не дрожал у центра)
let noseDir = -1;
function updateNose(){ if (yaw > 0.05) noseDir = -1; else if (yaw < -0.05) noseDir = 1; }

// ---- Плавная смена выражений: «перетекание клеток» ----
// Каждая деталь (левый глаз, правый глаз, рот) раскладывается на клетки 1x1. Клетки старой и новой формы
// сопоставляются по ближайшему расстоянию; лишние клетки отпочковываются от ближайшей или сливаются в неё.
// Каждая клетка плывёт по сглаженной траектории с небольшой задержкой (волна слева направо).
// Клетки остаются цельными квадратами; ?snap=1 — двигать их только по целым клеткам.
const NEUTRAL = () => partsState(SMALL ? smallParts : parts, true);
const SURPRISED = () => partsState(SMALL ? smallSurprised : surprisedParts, false);
const stateOf = id => id === -1 ? NEUTRAL() : id === -2 ? SURPRISED() : id === -3 ? CHARTS.btc : id === -4 ? CHARTS.eth : EXPR[id];
const SNAP = q.get('snap') === '1';
const EASE = q.get('ease') || 'back';
const STAG = 10;                                    // разброс старта клеток, кадров
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c1 = 1.2, c2 = c1 * 1.525;   // лёгкий «пружинный» перелёт
  return t < 0.5 ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
                 : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2; };
const ease = EASE === 'cubic' ? easeIO : easeBack;
const partsOf = st => [st.eyes[0], st.eyes[1], st.mouth];
let curId = expr, from = stateOf(expr), to = from, tf = 1, tl = 1, tracks = null;
const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
function matchPart(A, B, extraDelay){
  const pairs = [];
  A.forEach((a, i) => B.forEach((b, j) => pairs.push([d2(a, b), i, j])));
  pairs.sort((u, v) => u[0] - v[0] || u[1] - v[1] || u[2] - v[2]);
  const ua = new Set(), ub = new Set(), tr = [];
  for (const [, i, j] of pairs) if (!ua.has(i) && !ub.has(j)){ ua.add(i); ub.add(j); tr.push([A[i], B[j]]); }
  const near = (c, L) => L.reduce((m, o) => d2(c, o) < d2(c, m) ? o : m, L[0]);
  B.forEach((b, j) => { if (!ub.has(j)) tr.push([near(b, A), b]); });   // новая клетка отпочковывается
  A.forEach((a, i) => { if (!ua.has(i)) tr.push([a, near(a, B)]); });   // лишняя клетка сливается
  return tr.map(([a, b]) => ({ a, b, d: extraDelay + STAG * Math.min(1, Math.max(0, (b[0] + 8) / 16)) }));
}
function trackPos(t, f){
  const span = tl - STAG - 4;
  const u = ease(Math.max(0, Math.min(1, (f - t.d) / span)));
  let x = t.a[0] + (t.b[0] - t.a[0]) * u, y = t.a[1] + (t.b[1] - t.a[1]) * u;
  if (SNAP){ x = Math.round(x); y = Math.round(y); }
  return [x, y];
}
// Текущие клетки каждой детали (в том числе посреди перехода)
function currentParts(){
  if (!tracks || tf >= tl) return partsOf(to).map(cs => cs.map(c => [...c]));
  return tracks.map(tr => tr.map(t => trackPos(t, tf)));
}
function startMorph(A, B, len){
  tracks = A.map((cs, i) => matchPart(cs, B[i], i === 2 ? 4 : 0));   // рот чуть позже глаз
  tf = 0; tl = len;
}
function go(id, len = 36){
  if (id === curId) return;
  const A = currentParts();
  from = to; to = stateOf(id); curId = id;
  startMorph(A, partsOf(to), len);
}
const bbox = cs => { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const [x, y] of cs){ x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return { x0, x1, y0, y1, ax: (x0 + x1 + 1) / 2, ay: (y0 + y1 + 1) / 2, cy: Math.round((y0 + y1) / 2) }; };
// Сжатие по вертикали к строке ry (o = 1 — как есть, 0 — линия), без потерь пикселей (для моргания)
function squash(cs, o, ry){
  const m = new Map();
  for (const [x, y] of cs){ const ny = ry + Math.round((y - ry) * o); m.set(x + ',' + ny, [x, ny]); }
  return [...m.values()];
}
// Глиф рисуется жёстко: проецируется только точка привязки, форма не разваливается
function drawGlyph(g, k){
  const { cs } = g; if (!cs.length) return null;
  const bb = bbox(cs);
  const HW = Math.floor(cv.width / 2 / cell);   // не выходим за край экрана
  const dx = Math.max(Math.ceil(-HW - bb.x0), Math.min(Math.floor(HW - 1 - bb.x1), Math.round(PXf(g.ax, k, yaw) - g.ax)));
  const dy = Math.round(PYf(g.ay, k, pitch) - g.ay);
  for (const [x, y] of cs) ctx.fillRect(Math.round(cx + (x + dx) * cell), Math.round(cy + (y + dy - YC) * cell), cell, cell);
  return [Math.round(bb.x0 + dx), Math.round(bb.x1 + dx)];
}
function drawPart(p, ndx = 0){
  if (p.tip && noseDir > 0) p = { ...p, x0: 1 - p.x1, x1: 1 - p.x0 };
  const k = p.depth || 0;
  // тонкие детали (в 1 пиксель) всегда остаются толщиной в 1 пиксель
  let x0, x1, y0, y1;
  if (p.x1 - p.x0 === 1){ x0 = Math.round(PXf(p.x0 + 0.5, k, yaw) - 0.5); x1 = x0 + 1; }
  else { x0 = PX(p.x0, k, yaw); x1 = Math.max(x0 + 1, PX(p.x1, k, yaw)); }
  if (p.y1 - p.y0 === 1){ y0 = Math.round(PYf(p.y0 + 0.5, k, pitch) - 0.5); y1 = y0 + 1; }
  else { y0 = PY(p.y0, k, pitch); y1 = Math.max(y0 + 1, PY(p.y1, k, pitch)); }
  x0 += ndx; x1 += ndx;
  ctx.fillRect(cx + x0 * cell, cy + (y0 - YC) * cell, (x1 - x0) * cell, (y1 - y0) * cell);
}
function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = FG;
  const base = SMALL ? smallParts : parts;
  const morphing = tracks && tf < tl;
  const P = currentParts();
  const sides = [];
  for (let i = 0; i < 3; i++){
    let cs = P[i];
    // точка привязки для проекции плавно переходит от старой формы к новой
    let an = bbox(partsOf(to)[i]);
    if (morphing){
      const A = bbox(tracks[i].map(t => t.a)), u = ease(Math.min(1, tf / tl));
      an = { ax: A.ax + (an.ax - A.ax) * u, ay: A.ay + (an.ay - A.ay) * u };
    }
    if (i < 2 && !morphing && to.b && blink > 0){    // моргание: глаз сжимается к нижней строке
      const bb = bbox(cs), closed = blink > 3 && blink < 8;
      cs = closed && bb.x1 - bb.x0 < 2 ? [] : squash(cs, closed ? 0 : 0.5, bb.y1);
    }
    const r = drawGlyph({ cs, ax: an.ax, ay: an.ay }, 0);
    if (i < 2) sides.push(r);
  }
  // нос не заезжает на глаза: между ним и глазами всегда остаётся клетка
  // во время графика нос плавно гаснет — иначе он торчит посреди линии
  const morphU = morphing ? ease(Math.min(1, tf / tl)) : 1;
  const noseA = (to.chart && from.chart) ? 0 : to.chart ? 1 - morphU : from.chart ? morphU : 1;
  if (noseA > 0.02){
    ctx.globalAlpha = noseA;
    const st = base.find(q => q.depth && !q.tip);
    const nx = Math.round(PXf(st.x0 + 0.5, st.depth, yaw) - 0.5);
    let n2 = nx;
    if (sides[1]) n2 = Math.min(sides[1][0] - 2, n2);
    if (sides[0]) n2 = Math.max(sides[0][1] + 2, n2);
    base.filter(q => q.depth).forEach(q => drawPart(q, n2 - nx));
    ctx.globalAlpha = 1;
  }
}

let last = 0, acc = 0;
function loop(ts){
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000/60){ if (!frozen) step(); else if (surprise) surprise = 2; acc -= 1000/60; }
  draw();
  requestAnimationFrame(loop);
}
// Взгляд в точку экрана
let following = false;
function lookAt(clientX, clientY){
  const d = devicePixelRatio || 1;
  const lim = v => Math.max(-1, Math.min(1, v));
  ty = lim((clientX * d - cx) / (cv.width / 2) * 1.4) * 0.38;
  tp = lim((clientY * d - cy) / (cv.height / 2) * 1.4) * 0.25;
}
// Палец или мышь: лицо следит за ними; короткий тап — удивление
let down = null;
cv.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  following = true; lookAt(e.clientX, e.clientY); hold = 9999;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' || down){ following = true; lookAt(e.clientX, e.clientY); hold = 9999; }
});
function release(e){
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 12 && performance.now() - down.t < 350){
    surprise = 80; blink = 0; go(-2, 18);
  }
  down = null;
  if (e.pointerType !== 'mouse'){ following = false; hold = 100; }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse'){ following = false; hold = 100; } });

let frozen = false;
if (q.has('yaw')){ frozen = true; yaw = +q.get('yaw'); pitch = +(q.get('pitch')||0); blink = +(q.get('blink')||0); surprise = +(q.get('surprise')||0); updateNose();
  if (surprise){ curId = -2; from = to = SURPRISED(); }
  // ?mfrom=1&mto=6&mf=8 — застывший кадр перехода (0 — обычное лицо, btc/eth — график)
  if (q.has('mto')){
    const id = v => { const i = findExpr(v || '0'); return (i === -3 || i === -4 || i === -1 || EXPR[i]) ? i : -1; };
    const a = id(q.get('mfrom') || '0'), b = id(q.get('mto'));
    from = stateOf(a); to = stateOf(b); curId = b;
    startMorph(partsOf(from), partsOf(to), 36); tf = +(q.get('mf') || 0);
    palA = colorsOf(palFamOf(a)); palB = colorsOf(palFamOf(b));
    palT = Math.max(0, Math.min(1, tf / 36));
    const u = palT < 0.5 ? 4 * palT * palT * palT : 1 - Math.pow(-2 * palT + 2, 3) / 2;
    applyColors(mixHex(palA[0], palB[0], u), mixHex(palA[1], palB[1], u));
  }
}
requestAnimationFrame(ts => { last = ts; loop(ts); });
</script>
