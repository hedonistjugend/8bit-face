<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#000">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8-bit Face</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  html,body{margin:0;height:100%;background:var(--bg,#000);overflow:hidden}
  canvas{display:block;touch-action:none}
  /* Минималистичная строка ввода (только внешний вид) */
  :root{--fg:rgba(255,255,255,.2)}
  .chat{position:fixed;left:0;right:0;bottom:0;padding:0 24px 28px;font-family:'Press Start 2P',monospace;-webkit-font-smoothing:none}
  .chat .line{height:4px;background:var(--fg);margin-bottom:22px}
  .chat .row{display:flex;align-items:center;gap:16px}
  .chat input{all:unset;flex:1;min-width:0;font:inherit;font-size:18px;line-height:28px;color:var(--txt,#ddd);caret-color:var(--fg)}
  .chat input::placeholder{color:var(--fg)}
  #send{flex-shrink:0}
  .chat svg{shape-rendering:crispEdges;display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="chat">
  <div class="line"></div>
  <div class="row">
    <input type="text" placeholder="...">
    <span id="send"></span>
  </div>
</div>
<script>
// Пиксельная стрелка вправо
(() => {
  const g = ['    #   ','    ##  ','    ### ','########','    ### ','    ##  ','    #   '], u = 4;
  let r = '';
  g.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '#') r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }));
  document.getElementById('send').innerHTML =
    `<svg width="${g[0].length*u}" height="${g.length*u}" viewBox="0 0 ${g[0].length} ${g.length}" fill="var(--fg)">${r}</svg>`;
})();
</script>
<script>
const q = new URLSearchParams(location.search);
// Белый с прозрачностью (alpha=1 — чисто белый), лицо по умолчанию уменьшенное
const ALPHA = q.has('alpha') ? +q.get('alpha') : 0.2;
const SMALL = q.get('size') !== 'big';
// Случайная палитра Tailwind при каждой загрузке: [100, 400, 600, 950]
// Светлая тема: фон 100, лицо 600. Тёмная: фон 950, лицо 400. ?color=green, ?theme=light|dark
const TW = {
  red:['#fee2e2','#f87171','#dc2626','#450a0a'], orange:['#ffedd5','#fb923c','#ea580c','#431407'],
  amber:['#fef3c7','#fbbf24','#d97706','#451a03'], yellow:['#fef9c3','#facc15','#ca8a04','#422006'],
  lime:['#ecfccb','#a3e635','#65a30d','#1a2e05'], green:['#dcfce7','#4ade80','#16a34a','#052e16'],
  emerald:['#d1fae5','#34d399','#059669','#022c22'], teal:['#ccfbf1','#2dd4bf','#0d9488','#042f2e'],
  cyan:['#cffafe','#22d3ee','#0891b2','#083344'], sky:['#e0f2fe','#38bdf8','#0284c7','#082f49'],
  blue:['#dbeafe','#60a5fa','#2563eb','#172554'], indigo:['#e0e7ff','#818cf8','#4f46e5','#1e1b4b'],
  violet:['#ede9fe','#a78bfa','#7c3aed','#2e1065'], purple:['#f3e8ff','#c084fc','#9333ea','#3b0764'],
  fuchsia:['#fae8ff','#e879f9','#c026d3','#4a044e'], pink:['#fce7f3','#f472b6','#db2777','#500724'],
  rose:['#ffe4e6','#fb7185','#e11d48','#4c0519']
};
const NAMES = Object.keys(TW);
let FAMILY = q.get('color');
if (!TW[FAMILY]) {
  let last = null; try { last = localStorage.getItem('faceColor'); } catch(e){}
  const pool = NAMES.filter(n => n !== last);
  FAMILY = pool[Math.floor(Math.random() * pool.length)];
}
try { localStorage.setItem('faceColor', FAMILY); } catch(e){}
const mq = matchMedia('(prefers-color-scheme: light)');
let LIGHT = false, FG = '#fff';
function applyTheme(){
  const t = q.get('theme');
  LIGHT = t ? t === 'light' : mq.matches;
  const [c100, c400, c600, c950] = TW[FAMILY];
  FG = LIGHT ? c600 : c400;
  const st = document.documentElement.style;
  st.setProperty('--bg', LIGHT ? c100 : c950);
  st.setProperty('--fg', FG);
  st.setProperty('--txt', FG);
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', LIGHT ? c100 : c950);
}
mq.addEventListener && mq.addEventListener('change', applyTheme);
applyTheme();
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let cell, cx, cy;
function resize(){
  const d = devicePixelRatio || 1;
  cv.width = innerWidth * d; cv.height = innerHeight * d;
   cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  cell = Math.max(4, Math.floor(Math.min(cv.width / 17, cv.height / 22)));
  cx = Math.floor(cv.width / 2); cy = Math.floor(cv.height / 2);
}
addEventListener('resize', resize); resize();

// Лицо из прямоугольников в клетках (границы клеток). depth — насколько деталь "выступает" (нос сильнее)
const parts = [
  { x0:-6, x1:-5, y0:0, y1:2, eye:true },          // левый глаз
  { x0: 5, x1: 6, y0:0, y1:2, eye:true },          // правый глаз
  { x0: 0, x1: 1, y0:0, y1:6, depth:2.5 },         // нос
  { x0:-2, x1: 0, y0:5, y1:6, depth:2.5 },         // кончик носа
  { x0:-6, x1:-4, y0:8, y1:9 },                    // левый уголок рта
  { x0:-4, x1: 4, y0:9, y1:10 },                   // рот
  { x0: 4, x1: 6, y0:8, y1:9 },                    // правый уголок рта
];
// Удивлённое лицо: рот буквой "О" и глаза повыше
const surprisedParts = [
  { x0:-6, x1:-5, y0:-1, y1:2, eye:true },
  { x0: 5, x1: 6, y0:-1, y1:2, eye:true },
  { x0: 0, x1: 1, y0:0, y1:6, depth:2.5 },
  { x0:-2, x1: 0, y0:5, y1:6, depth:2.5 },
  { x0:-3, x1: 3, y0:8, y1:12, ring:true },        // рот буквой "О"
];
// Уменьшенное лицо (~на 20%) с теми же толстыми пикселями
const smallParts = [
  { x0:-5, x1:-4, y0:0, y1:2, eye:true },
  { x0: 4, x1: 5, y0:0, y1:2, eye:true },
  { x0: 0, x1: 1, y0:0, y1:5, depth:2 },
  { x0:-2, x1: 0, y0:4, y1:5, depth:2 },
  { x0:-5, x1:-3, y0:7, y1:8 },
  { x0:-3, x1: 3, y0:8, y1:9 },
  { x0: 3, x1: 5, y0:7, y1:8 },
];
const smallSurprised = [
  { x0:-5, x1:-4, y0:-1, y1:2, eye:true },
  { x0: 4, x1: 5, y0:-1, y1:2, eye:true },
  { x0: 0, x1: 1, y0:0, y1:5, depth:2 },
  { x0:-2, x1: 0, y0:4, y1:5, depth:2 },
  { x0:-3, x1: 3, y0:7, y1:11, ring:true },
];
let surprise = 0;
const RX = SMALL ? 7 : 8.5, RY = SMALL ? 8 : 9.5, YC = SMALL ? 4.5 : 5;
const clamp = v => Math.max(-0.999, Math.min(0.999, v));
// Проекция границы на "голову-сферу" с поворотом yaw (влево-вправо) и pitch (вверх-вниз)
const PXf = (e, k, yaw)   => RX * Math.sin(Math.asin(clamp(e / RX)) + yaw) + k * Math.sin(yaw);
const PYf = (e, k, pitch) => RY * Math.sin(Math.asin(clamp((e - YC) / RY)) + pitch) + YC + k * Math.sin(pitch);
const PX = (e, k, yaw)   => Math.round(PXf(e, k, yaw));
const PY = (e, k, pitch) => Math.round(PYf(e, k, pitch));

// Движение "размышления": голова плавно смотрит в разные точки и замирает
let yaw = 0, pitch = 0, ty = 0, tp = 0, hold = 60, blink = 0, nextBlink = 150, t = 0;
function pickTarget(){
  const poses = [[0,0],[0,0],[-0.3,-0.12],[0.3,-0.14],[-0.25,0.12],[0.22,0.15],[0,-0.2],[0.32,0],[-0.32,0.03]];
  const p = poses[Math.floor(Math.random() * poses.length)];
  ty = p[0] + (Math.random() - 0.5) * 0.06;
  tp = p[1] + (Math.random() - 0.5) * 0.06;
  hold = 50 + Math.random() * 110;
}

function step(){
  t++;
  if (!following && hold-- <= 0) pickTarget();
  const speed = surprise > 0 || following ? 0.18 : 0.06;
  yaw += (ty - yaw) * speed;
  pitch += (tp - pitch) * speed;
  if (surprise > 0) surprise--;
  if (surprise === 0 && --nextBlink <= 0){ blink = 10; nextBlink = 120 + Math.random() * 220; }
  if (blink > 0) blink--;
}

function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = FG;
  for (const p of (SMALL ? (surprise > 0 ? smallSurprised : smallParts) : (surprise > 0 ? surprisedParts : parts))){
    const k = p.depth || 0;
    if (p.ring){ // "О": рамка толщиной в 1 пиксель
      const L = Math.round(PXf(p.x0 + 0.5, k, yaw) - 0.5);
      const R2 = Math.max(L + 2, Math.round(PXf(p.x1 - 0.5, k, yaw) - 0.5));
      const T = Math.round(PYf(p.y0 + 0.5, k, pitch) - 0.5);
      const B = Math.max(T + 2, Math.round(PYf(p.y1 - 0.5, k, pitch) - 0.5));
      const r = (x, y, w, h) => ctx.fillRect(cx + x * cell, cy + (y - YC) * cell, w * cell, h * cell);
      r(L + 1, T, R2 - L - 1, 1); r(L + 1, B, R2 - L - 1, 1);
      r(L, T + 1, 1, B - T - 1); r(R2, T + 1, 1, B - T - 1);
      continue;
    }
    // тонкие детали (в 1 пиксель) всегда остаются толщиной в 1 пиксель
    let x0, x1, y0, y1;
    if (p.x1 - p.x0 === 1){ x0 = Math.round(PXf(p.x0 + 0.5, k, yaw) - 0.5); x1 = x0 + 1; }
    else { x0 = PX(p.x0, k, yaw); x1 = Math.max(x0 + 1, PX(p.x1, k, yaw)); }
    if (p.y1 - p.y0 === 1){ y0 = Math.round(PYf(p.y0 + 0.5, k, pitch) - 0.5); y1 = y0 + 1; }
    else { y0 = PY(p.y0, k, pitch); y1 = Math.max(y0 + 1, PY(p.y1, k, pitch)); }
    if (p.eye && blink > 0){
      if (blink > 3 && blink < 8) continue;   // глаз закрыт
      y0 = Math.max(y0, y1 - 1);              // полузакрыт
    }
    ctx.fillRect(cx + x0 * cell, cy + (y0 - YC) * cell, (x1 - x0) * cell, (y1 - y0) * cell);
  }
}

let last = 0, acc = 0;
function loop(ts){
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000/60){ if (!frozen) step(); else if (surprise) surprise = 2; acc -= 1000/60; }
  draw();
  requestAnimationFrame(loop);
}
// Взгляд в точку экрана
let following = false;
function lookAt(clientX, clientY){
  const d = devicePixelRatio || 1;
  const lim = v => Math.max(-1, Math.min(1, v));
  ty = lim((clientX * d - cx) / (cv.width / 2) * 1.4) * 0.38;
  tp = lim((clientY * d - cy) / (cv.height / 2) * 1.4) * 0.25;
}
// Палец или мышь: лицо следит за ними; короткий тап — удивление
let down = null;
cv.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  following = true; lookAt(e.clientX, e.clientY); hold = 9999;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' || down){ following = true; lookAt(e.clientX, e.clientY); hold = 9999; }
});
function release(e){
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 12 && performance.now() - down.t < 350){
    surprise = 80; blink = 0;
  }
  down = null;
  if (e.pointerType !== 'mouse'){ following = false; hold = 100; }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse'){ following = false; hold = 100; } });

let frozen = false;
if (q.has('yaw')){ frozen = true; yaw = +q.get('yaw'); pitch = +(q.get('pitch')||0); blink = +(q.get('blink')||0); surprise = +(q.get('surprise')||0); }
requestAnimationFrame(ts => { last = ts; loop(ts); });
</script>
</body>
</html>
