const mq = matchMedia('(prefers-color-scheme: light)');

  st.setProperty('--fg', FG);
  st.setProperty('--txt', FG);

applyTheme();
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let cell, cx, cy;
function resize(){
  const d = devicePixelRatio || 1;
  cv.width = innerWidth * d; cv.height = innerHeight * d;
   cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  cell = Math.max(4, Math.floor(Math.min(cv.width / 17, cv.height / 22)));
  cx = Math.floor(cv.width / 2); cy = Math.floor(cv.height / 2);

// Лицо из прямоугольников в клетках (границы клеток). depth — насколько деталь "выступает" (нос сильнее)
const parts = [
  { x0:-6, x1:-5, y0:0, y1:2, eye:true },          // левый глаз
  { x0: 5, x1: 6, y0:0, y1:2, eye:true },          // правый глаз
  { x0: 0, x1: 1, y0:0, y1:6, depth:2.5 },         // нос
  { x0:-2, x1: 0, y0:5, y1:6, depth:2.5, tip:true }, // кончик носа
  { x0:-6, x1:-4, y0:8, y1:9 },                    // левый уголок рта
  { x0:-4, x1: 4, y0:9, y1:10 },                   // рот
  { x0: 4, x1: 6, y0:8, y1:9 },                    // правый уголок рта
];
// Удивлённое лицо: рот буквой "О" и глаза повыше
const surprisedParts = [
  { x0:-6, x1:-5, y0:-1, y1:2, eye:true },
  { x0: 5, x1: 6, y0:-1, y1:2, eye:true },
  { x0: 0, x1: 1, y0:0, y1:6, depth:2.5 },
  { x0:-2, x1: 0, y0:5, y1:6, depth:2.5, tip:true },
  { x0:-3, x1: 3, y0:8, y1:12, ring:true },        // рот буквой "О"
];
// Уменьшенное лицо (~на 20%) с теми же толстыми пикселями
const smallParts = [
  { x0:-5, x1:-4, y0:0, y1:2, eye:true },
  { x0: 4, x1: 5, y0:0, y1:2, eye:true },
  { x0: 0, x1: 1, y0:0, y1:5, depth:2 },
  { x0:-2, x1: 0, y0:4, y1:5, depth:2, tip:true },
  { x0:-5, x1:-3, y0:7, y1:8 },
  { x0:-3, x1: 3, y0:8, y1:9 },
  { x0: 3, x1: 5, y0:7, y1:8 },
];
const smallSurprised = [
  { x0:-5, x1:-4, y0:-1, y1:2, eye:true },
  { x0: 4, x1: 5, y0:-1, y1:2, eye:true },
  { x0: 0, x1: 1, y0:0, y1:5, depth:2 },
  { x0:-2, x1: 0, y0:4, y1:5, depth:2, tip:true },
  { x0:-3, x1: 3, y0:7, y1:11, ring:true },
];
const EXPR = [
  {n:'smile', L:'-7,-1;-7,0;-6,-2;-5,-2;-4,-2;-3,-1;-3,0', R:'2,-1;2,0;3,-2;4,-2;5,-2;6,-1;6,0', m:'smile'},
  {n:'uh oh', L:'-6,-1;-6,0;-5,-1;-5,0', R:'4,-1;4,0;5,-1;5,0', m:'smallFrown', b:1},
  {n:'sleepy tired', L:'-7,-1;-6,-1;-5,-1;-4,-1;-3,-1', R:'2,-1;3,-1;4,-1;5,-1;6,-1', m:'flat'},
  {n:'tears', L:'-6,-3;-6,-2;-6,0;-6,2;-5,-3;-5,-2;-5,0;-5,1', R:'4,-3;4,-2;4,0;4,1;5,-3;5,-2;5,0;5,2', m:'frown'},
  {n:'dizzy', L:'-8,-2;-8,-1;-8,0;-8,1;-7,-3;-7,2;-6,-3;-6,-1;-6,0;-6,2;-5,-3;-5,-1;-5,0;-5,2;-4,-3;-4,0;-4,2;-3,-2;-3,-1', R:'2,-2;2,-1;2,0;2,1;3,-3;3,2;4,-3;4,-1;4,0;4,2;5,-3;5,-1;5,0;5,2;6,-3;6,0;6,2;7,-2;7,-1', m:'wavy'},
  {n:'amazed', L:'-8,-2;-8,-1;-8,0;-8,1;-7,-3;-7,2;-6,-3;-6,2;-5,-3;-5,2;-4,-3;-4,2;-3,-2;-3,-1;-3,0;-3,1', R:'2,-2;2,-1;2,0;2,1;3,-3;3,2;4,-3;4,2;5,-3;5,2;6,-3;6,2;7,-2;7,-1;7,0;7,1', m:'O', b:1},
  {n:'astonished', L:'-7,-2;-7,0;-6,-1;-5,-3;-5,-2;-5,-1;-5,0;-5,1;-4,-1;-3,-2;-3,0', R:'2,-2;2,0;3,-1;4,-3;4,-2;4,-1;4,0;4,1;5,-1;6,-2;6,0', m:'tiny'},
  {n:'ouch', L:'-7,-3;-7,1;-6,-3;-6,-2;-6,0;-6,1;-5,-2;-5,-1;-5,0;-4,-1', R:'3,-1;4,-2;4,-1;4,0;5,-3;5,-2;5,0;5,1;6,-3;6,1', m:'wavy'},
  {n:'happy', L:'-7,0;-6,-1;-5,-2;-4,-1;-3,0', R:'2,0;3,-1;4,-2;5,-1;6,0', m:'smile'},
  {n:'happier', L:'-8,-4;-7,-5;-7,-4;-7,-3;-7,0;-6,-4;-6,-1;-5,-2;-4,-1;-3,0', R:'2,0;3,-1;4,-2;5,-4;5,-1;6,-5;6,-4;6,-3;6,0;7,-4', m:'grin'},
  {n:'glad', L:'-7,0;-6,-1;-5,-2;-4,-1;-3,0', R:'2,0;3,-1;4,-2;5,-1;6,0', m:'smallSmile'},
  {n:'dead', L:'-7,-3;-7,1;-6,-2;-6,0;-5,-1;-4,-2;-4,0;-3,-3;-3,1', R:'2,-3;2,1;3,-2;3,0;4,-1;5,-2;5,0;6,-3;6,1', m:'dot'},
  {n:'bored', L:'-7,-2;-7,0;-6,-2;-6,0;-5,-2;-5,0;-4,-2;-4,0;-3,-2;-3,0', R:'2,-2;2,0;3,-2;3,0;4,-2;4,0;5,-2;5,0;6,-2;6,0', m:'flat'},
  {n:'i love it', L:'-7,-2;-7,0;-6,-1;-5,-3;-5,-2;-5,-1;-5,0;-5,1;-4,-1;-3,-2;-3,0', R:'2,-2;2,0;3,-1;4,-3;4,-2;4,-1;4,0;4,1;5,-1;6,-2;6,0', m:'grin'},
  {n:'sad', L:'-5,-3;-5,-2;-5,-1;-5,1', R:'4,-3;4,-2;4,-1;4,1', m:'frown', b:1},
  {n:'incredulous', L:'-7,-1;-7,0;-6,-2;-6,1;-5,-2;-5,1;-4,-1;-4,0', R:'2,-2;2,-1;2,0;2,1;3,-3;3,2;4,-3;4,2;5,-3;5,2;6,-3;6,2;7,-2;7,-1;7,0;7,1', m:'crooked', b:1},
  {n:'incredible', L:'-7,-2;-7,0;-6,-1;-5,-3;-5,-2;-5,-1;-5,0;-5,1;-4,-1;-3,-2;-3,0', R:'2,-2;2,0;3,-1;4,-3;4,-2;4,-1;4,0;4,1;5,-1;6,-2;6,0', m:'O'},
  {n:'seriously', L:'-7,-1;-7,0;-6,-2;-6,1;-5,-2;-5,1;-4,-1;-4,0', R:'3,-1;3,0;4,-2;4,1;5,-2;5,1;6,-1;6,0', m:'flat', b:1},
  {n:'crying bad', L:'-6,-3;-6,-2;-6,0;-6,2;-5,-3;-5,-2;-5,0;-5,1', R:'4,-3;4,-2;4,0;4,1;5,-3;5,-2;5,0;5,2', m:'o'},
  {n:'confused', L:'-6,-1;-6,0;-5,-1;-5,0', R:'4,-1;4,0;5,-4;5,-3;5,-1;5,0', m:'crookedL', b:1},
  {n:'i messed it up', L:'-5,-1;-4,-1;-3,-1', R:'2,-1;3,-1;4,-1;6,-1;6,0;6,2;6,4;7,-1;7,0;7,2;7,3', m:'smallFrown'},
  {n:'serious', L:'-5,-2;-5,-1;-5,0', R:'4,-2;4,-1;4,0', m:'flat', b:1},
  {n:'sleepy sad', L:'-7,-2;-7,-1;-6,0;-5,0;-4,0;-3,-2;-3,-1', R:'2,-2;2,-1;3,0;4,0;5,0;6,-2;6,-1', m:'smallFrown'},
  {n:'noooo', L:'-6,-2;-6,0;-5,-1;-4,-2;-4,0', R:'3,-2;3,0;4,-1;5,-2;5,0', m:'O'},
  {n:'yuck', L:'-7,-3;-7,1;-6,-3;-6,-2;-6,0;-6,1;-5,-2;-5,-1;-5,0;-4,-1', R:'3,-1;4,-2;4,-1;4,0;5,-3;5,-2;5,0;5,1;6,-3;6,1', m:'o'},
  {n:'wink', L:'-7,-1;-6,-1;-5,-1;-4,-1;-3,-1', R:'2,-2;2,-1;2,0;2,1;3,-3;3,2;4,-3;4,2;5,-3;5,2;6,-3;6,2;7,-2;7,-1;7,0;7,1', m:'smirk'},
  {n:'jealous', L:'-8,-3;-8,-2;-8,-1;-8,0;-8,1;-7,-3;-7,-1;-7,1;-6,-3;-6,-2;-6,-1;-6,0;-6,1;-4,-2;-4,0;-3,-1', R:'2,-1;3,-2;3,0;5,-3;5,-2;5,-1;5,0;5,1;6,-3;6,-1;6,1;7,-3;7,-2;7,-1;7,0;7,1', m:'wavy'},
  {n:'didnt sleep', L:'-7,-2;-7,-1;-6,-3;-6,0;-6,2;-5,-3;-5,0;-5,2;-4,-2;-4,-1;-4,0;-4,1', R:'3,-2;3,-1;4,-3;4,0;4,2;5,-3;5,0;5,2;6,-2;6,-1;6,0;6,1', m:'flat', b:1},
  {n:'awry', L:'-7,-3;-7,1;-6,-3;-6,-2;-6,0;-6,1;-5,-2;-5,-1;-5,0;-4,-1', R:'3,-3;3,1;4,-3;4,-2;4,0;4,1;5,-2;5,-1;5,0;6,-1', m:'crooked'},
  {n:'youre crazy', L:'-7,-1;-6,-2;-5,-1;-4,0;-3,-1', R:'2,-1;3,-2;4,-1;5,0;6,-1', m:'o'}
];
// Рты выражений (клетки, '#' — пиксель), [рисунок, x, y] для маленького лица
const MOUTH = {
  smile:     [['##......##','..######..'], -5, 7],
  frown:     [['..######..','##......##'], -5, 7],
  smallSmile:[['#....#','.####.'], -3, 7],
  smallFrown:[['.####.','#....#'], -3, 7],
  flat:      [['######'], -3, 8],
  O:         [['.####.','#....#','#....#','#....#','.####.'], -3, 7],
  o:         [['.##.','#..#','#..#','.##.'], -2, 7],
  tiny:      [['.##.','#..#'], -2, 8],
  dot:       [['##','##'], -1, 8],
  crooked:   [['....##','####..'], -3, 7],
  crookedL:  [['##....','..####'], -3, 7],
  wavy:      [['.##..##.','#..##..#'], -4, 7],
  grin:      [['########','#......#','.######.'], -4, 7],
  smirk:     [['.....#','#####.'], -3, 7],
};
const dec = s => s.split(';').map(p => p.split(',').map(Number));
const artCells = ([rows, ox, oy]) => rows.flatMap((r, j) => [...r].flatMap((ch, i) => ch === '#' ? [[ox + i, oy + j]] : []));
// Для большого лица глаза разводятся на клетку, рот опускается на клетку
for (const e of EXPR){
  const bx = SMALL ? 0 : 1, by = SMALL ? 0 : 1;
  e.eyes = [dec(e.L).map(([x, y]) => [x - bx, y]), dec(e.R).map(([x, y]) => [x + bx, y])];
  e.mouth = artCells(MOUTH[e.m]).map(([x, y]) => [x, y + by]);
}
// Состояния лица в клетках: глаза (список глифов), рот, b — моргает ли, s — насколько поворачивается голова
const toCells = p => { const r = []; for (let x = p.x0; x < p.x1; x++) for (let y = p.y0; y < p.y1; y++) r.push([x, y]); return r; };
const ringCells = p => toCells(p).filter(([x, y]) => {
  const ex = x === p.x0 || x === p.x1 - 1, ey = y === p.y0 || y === p.y1 - 1;
  return (ex || ey) && !(ex && ey);
});
const partsState = (ps, b) => ({ eyes: ps.filter(p => p.eye).map(toCells),
  mouth: ps.filter(p => !p.eye && !p.depth).flatMap(p => p.ring ? ringCells(p) : toCells(p)), b, s: 1 });
for (const e of EXPR) e.s = 0.6;   // у выражений глаза шире — голова поворачивается мягче
// Пока в случайной смене только первый ряд выражений (остальные доступны через ?expr=N)
const CYCLE = [0, 1, 2, 3, 4, 5];
// ?expr=5 или ?expr=dizzy фиксирует выражение, ?cycle=fast — быстрая смена
let expr = -1, exprTimer = 0, exprFixed = false;
const FAST = q.get('cycle') === 'fast';
const findExpr = v => { v = v.toLowerCase().replace(/[_+-]/g, ' '); return /^\d+$/.test(v) ? +v - 1 : EXPR.findIndex(e => e.n === v); };
if (q.has('expr')){ const i = findExpr(q.get('expr')); if (EXPR[i]){ expr = i; exprFixed = true; } }
const nextExprDelay = () => FAST ? 60 + Math.random() * 90 : 180 + Math.random() * 420; // 3–10 c при 60 кадрах/с
exprTimer = nextExprDelay();
function updateExpr(){
  if (exprFixed || surprise > 0 || --exprTimer > 0) return;
  if (expr >= 0 && Math.random() < 0.4) expr = -1;               // иногда возвращаемся к обычному лицу
  else { let n; do n = CYCLE[Math.floor(Math.random() * CYCLE.length)]; while (n === expr); expr = n; }
  exprTimer = nextExprDelay();
  go(expr);
  console.log('expr', expr < 0 ? 'neutral' : (expr + 1) + ' ' + EXPR[expr].n);
}
let surprise = 0;
const RX = SMALL ? 7 : 8.5, RY = SMALL ? 8 : 9.5, YC = SMALL ? 4.5 : 5;
const clamp = v => Math.max(-0.999, Math.min(0.999, v));
// Проекция границы на "голову-сферу" с поворотом yaw (влево-вправо) и pitch (вверх-вниз)
const PXf = (e, k, yaw)   => RX * Math.sin(Math.asin(clamp(e / RX)) + yaw) + k * Math.sin(yaw);
const PYf = (e, k, pitch) => RY * Math.sin(Math.asin(clamp((e - YC) / RY)) + pitch) + YC + k * Math.sin(pitch);
const PX = (e, k, yaw)   => Math.round(PXf(e, k, yaw));
const PY = (e, k, pitch) => Math.round(PYf(e, k, pitch));

// Движение "размышления": голова плавно смотрит в разные точки и замирает
let yaw = 0, pitch = 0, ty = 0, tp = 0, hold = 60, blink = 0, nextBlink = 150, t = 0;
function pickTarget(){
  const poses = [[0,0],[0,0],[-0.3,-0.12],[0.3,-0.14],[-0.25,0.12],[0.22,0.15],[0,-0.2],[0.32,0],[-0.32,0.03]];
  const p = poses[Math.floor(Math.random() * poses.length)];
  ty = p[0] + (Math.random() - 0.5) * 0.06;
  tp = p[1] + (Math.random() - 0.5) * 0.06;
  hold = 50 + Math.random() * 110;
}

function step(){
  t++;
  if (!following && hold-- <= 0) pickTarget();
  const speed = surprise > 0 || following ? 0.18 : 0.06;
  yaw += (ty - yaw) * speed;
  pitch += (tp - pitch) * speed;
  if (surprise > 0 && --surprise === 0) go(expr, 20);
  if (tf < tl) tf++;
  if (surprise === 0 && --nextBlink <= 0){ blink = 10; nextBlink = 120 + Math.random() * 220; }
  if (blink > 0) blink--;
  updateExpr();
  updateNose();
}
// Кончик носа загибается в сторону, противоположную повороту головы (с гистерезисом, чтобы не дрожал у центра)
let noseDir = -1;
function updateNose(){ if (yaw > 0.05) noseDir = -1; else if (yaw < -0.05) noseDir = 1; }

// ---- Плавная 8-битная смена выражений ----
// Глаз схлопывается в линию (как при моргании), линия перетекает в ширину нового глаза и раскрывается в новую форму.
// Рот делает то же самое с небольшой задержкой. Всё в целых клетках, без размытия.
const NEUTRAL = () => partsState(SMALL ? smallParts : parts, true);
const SURPRISED = () => partsState(SMALL ? smallSurprised : surprisedParts, false);
const stateOf = id => id === -1 ? NEUTRAL() : id === -2 ? SURPRISED() : EXPR[id];
let curId = expr, from = stateOf(expr), to = from, tf = 1, tl = 1;
function go(id, len = 26){
  if (id === curId) return;
  from = tf < tl / 2 ? from : to;      // если смена началась посреди другой — стартуем с ближайшей формы
  to = stateOf(id); curId = id; tf = 0; tl = len;
}
const bbox = cs => { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const [x, y] of cs){ x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return { x0, x1, y0, y1, ax: (x0 + x1 + 1) / 2, ay: (y0 + y1 + 1) / 2, cy: Math.round((y0 + y1) / 2) }; };
// Сжатие по вертикали к строке ry (o = 1 — как есть, 0 — линия), без потерь пикселей
function squash(cs, o, ry){
  const m = new Map();
  for (const [x, y] of cs){ const ny = ry + Math.round((y - ry) * o); m.set(x + ',' + ny, [x, ny]); }
  return [...m.values()];
}
const key = cs => cs.map(c => c.join(',')).sort().join(';');
// Кадр перехода глифа A -> B на шаге f из L. Возвращает клетки и точку привязки для проекции
function morph(A, B, f, L){
  const a = bbox(A), b = bbox(B);
  if (f >= L || key(A) === key(B)) return { cs: B, ax: b.ax, ay: b.ay };
  if (f <= 0) return { cs: A, ax: a.ax, ay: a.ay };
  const p = f / L, n1 = 0.4, n2 = 0.6;
  const ax = a.ax + (b.ax - a.ax) * p, ay = a.ay + (b.ay - a.ay) * p;
  let cs;
  if (p < n1) cs = squash(A, 1 - p / n1, a.cy);
  else if (p < n2){
    const u = (p - n1) / (n2 - n1);
    const x0 = Math.round(a.x0 + (b.x0 - a.x0) * u), x1 = Math.round(a.x1 + (b.x1 - a.x1) * u);
    const y = Math.round(a.cy + (b.cy - a.cy) * u);
    cs = []; for (let x = x0; x <= x1; x++) cs.push([x, y]);
  } else cs = squash(B, (p - n2) / (1 - n2), b.cy);
  return { cs, ax, ay };
}
// Глиф рисуется жёстко: проецируется только точка привязки, форма не разваливается
function drawGlyph(g, k){
  const { cs } = g; if (!cs.length) return null;
  const bb = bbox(cs);
  const HW = Math.floor(cv.width / 2 / cell);   // не выходим за край экрана
  const dx = Math.max(-HW - bb.x0, Math.min(HW - 1 - bb.x1, Math.round(PXf(g.ax, k, yaw) - g.ax)));
  const dy = Math.round(PYf(g.ay, k, pitch) - g.ay);
  for (const [x, y] of cs) ctx.fillRect(cx + (x + dx) * cell, cy + (y + dy - YC) * cell, cell, cell);
  return [bb.x0 + dx, bb.x1 + dx];
}
function drawPart(p, ndx = 0){
  if (p.tip && noseDir > 0) p = { ...p, x0: 1 - p.x1, x1: 1 - p.x0 };
  const k = p.depth || 0;
  // тонкие детали (в 1 пиксель) всегда остаются толщиной в 1 пиксель
  let x0, x1, y0, y1;
  if (p.x1 - p.x0 === 1){ x0 = Math.round(PXf(p.x0 + 0.5, k, yaw) - 0.5); x1 = x0 + 1; }
  else { x0 = PX(p.x0, k, yaw); x1 = Math.max(x0 + 1, PX(p.x1, k, yaw)); }
  if (p.y1 - p.y0 === 1){ y0 = Math.round(PYf(p.y0 + 0.5, k, pitch) - 0.5); y1 = y0 + 1; }
  else { y0 = PY(p.y0, k, pitch); y1 = Math.max(y0 + 1, PY(p.y1, k, pitch)); }
  x0 += ndx; x1 += ndx;
  ctx.fillRect(cx + x0 * cell, cy + (y0 - YC) * cell, (x1 - x0) * cell, (y1 - y0) * cell);
}
function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = FG;
  const base = SMALL ? smallParts : parts;
  const p = Math.min(1, tf / tl);
  const Y = yaw; yaw *= from.s + (to.s - from.s) * p;
  const sides = [];
  for (let i = 0; i < 2; i++){
    let g = morph(from.eyes[i], to.eyes[i], tf, tl);
    if (tf >= tl && to.b && blink > 0){           // моргание: глаз сжимается к нижней строке
      const bb = bbox(g.cs), closed = blink > 3 && blink < 8;
      g = { ...g, cs: closed && bb.x1 - bb.x0 < 2 ? [] : squash(g.cs, closed ? 0 : 0.5, bb.y1) };
    }
    sides.push(drawGlyph(g, 0));
  }
  drawGlyph(morph(from.mouth, to.mouth, Math.max(0, tf - 3), tl - 3), 0);   // рот чуть запаздывает
  // нос не заезжает на глаза: между ним и глазами всегда остаётся клетка
  const st = base.find(q => q.depth && !q.tip);
  const nx = Math.round(PXf(st.x0 + 0.5, st.depth, yaw) - 0.5);
  let n2 = nx;
  if (sides[1]) n2 = Math.min(sides[1][0] - 2, n2);
  if (sides[0]) n2 = Math.max(sides[0][1] + 2, n2);
  base.filter(q => q.depth).forEach(q => drawPart(q, n2 - nx));
  yaw = Y;
}

let last = 0, acc = 0;
function loop(ts){
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000/60){ if (!frozen) step(); else if (surprise) surprise = 2; acc -= 1000/60; }
  draw();
  requestAnimationFrame(loop);
}
// Взгляд в точку экрана
let following = false;
function lookAt(clientX, clientY){
  const d = devicePixelRatio || 1;
  const lim = v => Math.max(-1, Math.min(1, v));
  ty = lim((clientX * d - cx) / (cv.width / 2) * 1.4) * 0.38;
  tp = lim((clientY * d - cy) / (cv.height / 2) * 1.4) * 0.25;
}
// Палец или мышь: лицо следит за ними; короткий тап — удивление
let down = null;
cv.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  following = true; lookAt(e.clientX, e.clientY); hold = 9999;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' || down){ following = true; lookAt(e.clientX, e.clientY); hold = 9999; }
});
function release(e){
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 12 && performance.now() - down.t < 350){
    surprise = 80; blink = 0; go(-2, 10);
  }
  down = null;
  if (e.pointerType !== 'mouse'){ following = false; hold = 100; }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse'){ following = false; hold = 100; } });

let frozen = false;
if (q.has('yaw')){ frozen = true; yaw = +q.get('yaw'); pitch = +(q.get('pitch')||0); blink = +(q.get('blink')||0); surprise = +(q.get('surprise')||0); updateNose();
  if (surprise){ curId = -2; from = to = SURPRISED(); }
  // ?mfrom=1&mto=6&mf=8 — застывший кадр перехода (0 — обычное лицо)
  if (q.has('mto')){ const id = v => +v ? findExpr(v) : -1; from = stateOf(id(q.get('mfrom') || '0')); to = stateOf(id(q.get('mto'))); tl = 26; tf = +(q.get('mf') || 0); }
}
requestAnimationFrame(ts => { last = ts; loop(ts); });
</script>
